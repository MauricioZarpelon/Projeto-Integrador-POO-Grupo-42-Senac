{% extends 'layout.html' %}
{% block content %}
<h1>Pessoas Físicas</h1>
<a class="btn-add" href="{{ url_for('pessoa_fisica_bp.formulario') }}">➕ Adicionar Novo</a>

<table>
  <thead>
    <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>Ações</th></tr>
  </thead>
  <tbody>
    {% for p in registros %}
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.nome }}</td>
      <td>{{ p.cpf }}</td>
      <td>{{ p.telefone or '-' }}</td>
      <td class="actions">
        <a href="{{ url_for('pessoa_fisica_bp.editar', id=p.id) }}">Editar</a>
        <a class="delete" href="{{ url_for('pessoa_fisica_bp.excluir', id=p.id) }}" onclick="return confirm('Excluir?')">Excluir</a>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5">Nenhum registro encontrado.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
