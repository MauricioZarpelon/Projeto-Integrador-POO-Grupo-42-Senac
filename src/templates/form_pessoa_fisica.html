{% extends 'layout.html' %}
{% block content %}
<h1>{{ 'Editar' if registro else 'Novo' }} Pessoa Física</h1>

<form id="pf-form" method="post" action="{{ url_for('pessoa_fisica_bp.editar', id=registro.id) if registro else url_for('pessoa_fisica_bp.criar') }}">
  <div class="form-row">
    <div class="form-group">
      <label for="nome">Nome Completo *</label>
      <input type="text" id="nome" name="nome" value="{{ registro.nome if registro else '' }}" required>
    </div>
    <div class="form-group">
      <label for="cpf">CPF *</label>
      <input type="text" id="cpf" name="cpf" value="{{ registro.cpf if registro else '' }}" placeholder="000.000.000-00" required>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" value="{{ registro.telefone if registro else '' }}">
    </div>
  </div>

  <div class="buttons">
    <button type="submit" class="btn btn-primary">SALVAR</button>
    <a href="{{ url_for('pessoa_fisica_bp.listar') }}" class="btn btn-secondary" style="text-decoration:none;display:inline-block;padding:10px 18px;">CANCELAR</a>
  </div>
</form>

<script>
/* Validação CPF simples (só formato e dígitos) + obrigatório */
function somenteNumeros(s){ return s.replace(/\D/g,''); }

function validarCPFFormat(cpf){
    cpf = somenteNumeros(cpf);
    if(cpf.length !== 11) return false;
    // validação básica de repetição
    if(/^(\d)\1+$/.test(cpf)) return false;
    // cálculo dígitos
    var sum = 0, rest;
    for (var i=1; i<=9; i++) sum += parseInt(cpf.substring(i-1, i)) * (11 - i);
    rest = (sum * 10) % 11; if (rest === 10) rest = 0;
    if (rest !== parseInt(cpf.substring(9, 10))) return false;
    sum = 0;
    for (i = 1; i <= 10; i++) sum += parseInt(cpf.substring(i-1, i)) * (12 - i);
    rest = (sum * 10) % 11; if (rest === 10) rest = 0;
    if (rest !== parseInt(cpf.substring(10, 11))) return false;
    return true;
}

document.getElementById('pf-form').addEventListener('submit', function(e){
    var cpf = document.getElementById('cpf').value;
    if(!validarCPFFormat(cpf)){
        alert('CPF inválido. Verifique o número.');
        e.preventDefault();
        return false;
    }
});
</script>

{% endblock %}
