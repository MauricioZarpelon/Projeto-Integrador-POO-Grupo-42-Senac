{% extends 'layout.html' %}
{% block content %}
<h1>Departamentos</h1>
<a class="btn-add" href="{{ url_for('departamento_bp.formulario') }}">➕ Novo</a>
<table>
<thead><tr><th>ID</th><th>Nome</th><th>Sigla</th><th>Ações</th></tr></thead>
<tbody>
{% for d in registros %}<tr><td>{{ d.id }}</td><td>{{ d.nome }}</td><td>{{ d.sigla or '-' }}</td><td class="actions"><a href="{{ url_for('departamento_bp.editar', id=d.id) }}">Editar</a> <a class="delete" href="{{ url_for('departamento_bp.excluir', id=d.id) }}" onclick="return confirm('Excluir?')">Excluir</a></td></tr>{% else %}<tr><td colspan="4">Nenhum registro.</td></tr>{% endfor %}
</tbody>
</table>
{% endblock %}
