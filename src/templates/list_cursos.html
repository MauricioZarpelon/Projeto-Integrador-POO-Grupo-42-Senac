{% extends 'layout.html' %}
{% block content %}
<h1>Cursos</h1>
<a class="btn-add" href="{{ url_for('curso_bp.formulario') }}">➕ Novo Curso</a>
<table>
<thead><tr><th>ID</th><th>Nome</th><th>Duração (sem.)</th><th>Ações</th></tr></thead>
<tbody>
{% for c in registros %}
<tr><td>{{ c.id }}</td><td>{{ c.nome }}</td><td>{{ c.duracao_semestres }}</td><td class="actions"><a href="{{ url_for('curso_bp.editar', id=c.id) }}">Editar</a> <a class="delete" href="{{ url_for('curso_bp.excluir', id=c.id) }}" onclick="return confirm('Excluir?')">Excluir</a></td></tr>
{% else %}<tr><td colspan="4">Nenhum registro.</td></tr>{% endfor %}
</tbody>
</table>
{% endblock %}
