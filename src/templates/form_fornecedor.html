{% extends 'layout.html' %}
{% block content %}
<h1>{{ 'Editar' if registro else 'Novo' }} Fornecedor</h1>
<form method="post" action="{{ url_for('fornecedor_bp.editar', id=registro.id) if registro else url_for('fornecedor_bp.criar') }}">
  <div class="form-row">
    <div class="form-group">
      <label>CNPJ *</label>
      <input type="text" id="cnpj" name="cnpj" value="{{ registro.cnpj if registro else '' }}" placeholder="00.000.000/0000-00" required>
    </div>
    <div class="form-group">
      <label>Nome da Empresa *</label>
      <input type="text" id="nome_empresa" name="nome_empresa" value="{{ registro.razao_social if registro else '' }}" required>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Ramo de Atividade</label>
      <input name="ramo_atividade" value="{{ registro.ramo_atividade if registro else '' }}">
    </div>
    <div class="form-group">
      <label>Contato</label>
      <input name="contato" value="{{ registro.contato if registro else '' }}">
    </div>
  </div>
  <div class="buttons">
    <button class="btn btn-primary" type="submit">SALVAR</button>
    <a class="btn btn-secondary" href="{{ url_for('fornecedor_bp.listar') }}">CANCELAR</a>
  </div>
</form>

<script>
// Formatação automática do CNPJ
document.getElementById('cnpj').addEventListener('input', function(e) {
  let value = e.target.value.replace(/\D/g, '');

  if (value.length <= 14) {
    if (value.length > 12) {
      value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
    } else if (value.length > 8) {
      value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})/, '$1.$2.$3/$4');
    } else if (value.length > 5) {
      value = value.replace(/^(\d{2})(\d{3})(\d{3})/, '$1.$2.$3');
    } else if (value.length > 2) {
      value = value.replace(/^(\d{2})(\d{3})/, '$1.$2');
    }
    e.target.value = value;
  }
});
</script>
{% endblock %}
